name: Inventory DB keepalive until inactive

on:
  schedule:
    # 09:15 JST every day. The workflow disables itself after 14 inactive days.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: inventory-db-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check real form activity and keep the database awake
        id: activity
        shell: bash
        run: |
          set -euo pipefail
          all_inactive=true
          for store_id in 7249 7539; do
            response_file="response-${store_id}.json"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 45 \
              "https://kiroku-exe.pages.dev/api/order/activity?store_id=${store_id}" \
              --output "${response_file}"

            if node -e '
              const fs = require("node:fs");
              const file = process.argv[1];
              const storeId = process.argv[2];
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              if (data.ok !== true || data.store_id !== storeId || typeof data.inactive_14_days !== "boolean") {
                console.error(`Invalid activity response for store ${storeId}`, data);
                process.exit(1);
              }
              console.log(`Store ${storeId}: inactive days = ${data.inactive_days ?? "no history"}`);
              process.exit(data.inactive_14_days ? 0 : 10);
            ' "${response_file}" "${store_id}"; then
              :
            else
              result=$?
              if [ "$result" -eq 10 ]; then all_inactive=false; else exit "$result"; fi
            fi
          done
          echo "all_inactive=${all_inactive}" >> "$GITHUB_OUTPUT"

      - name: Stop automatic keepalive after 14 inactive days
        if: steps.activity.outputs.all_inactive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "No store has saved inventory for 14 days. Disabling this workflow."
          gh api --method PUT "repos/${REPOSITORY}/actions/workflows/inventory-db-health.yml/disable"
